# Application Configuration
server.port=8080

# Logging Configuration (Spring Boot default + SI)
logging.level.org.springframework.integration=INFO
logging.level.com.example.trainservicecrewsi=DEBUG

# Custom Application Properties for File Paths
app.log.received.folder=logs/received
app.log.sent.folder=logs/sent
app.log.error.folder=logs/error
app.report.csv.folder=reports
app.report.csv.prefix=train_service_report_

# Spring Integration Error Channel Configuration
spring.integration.error.require-subscribers=true
spring.integration.error.send-timeout=1000

