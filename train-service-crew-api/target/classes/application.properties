# Application Configuration
server.port=8080

# Logging Configuration (Paths can be customized)
logging.file.name=logs/application.log
logging.level.com.example.trainservicecrewapi=INFO

# Custom Application Properties
# Folders for logging requests/responses (absolute paths recommended for production)
app.log.received.folder=logs/received
app.log.sent.folder=logs/sent
app.log.error.folder=logs/error

# CSV Reporting Configuration
app.report.csv.folder=reports
app.report.csv.prefix=train_service_report_

# Second Endpoint Configuration (if needed, e.g., URL for external call)
# app.external.status.endpoint.url=http://localhost:8081/status # Example

